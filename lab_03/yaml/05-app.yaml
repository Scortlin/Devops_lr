apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels:
    app: marketing-roi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marketing-roi
  template:
    metadata:
      labels:
        app: marketing-roi
    spec:
      serviceAccountName: marketing-roi-sa

      initContainers:
      - name: wait-for-db
        image: busybox:1.28
        command:
        - "sh"
        - "-c"
        - |
          echo "Waiting for database..."
          until nc -z db-service 5432; do
            echo "Database not ready, waiting 2 seconds..."
            sleep 2
          done
          echo "Database is ready!"

      containers:
      - name: dashboard
        image: marketing-roi-app:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8050
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: db-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

        livenessProbe:
          httpGet:
            path: /health
            port: 8050
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3

        # Readiness probe - ТЗ: трафик не идет, пока не загружена ML-модель
        # Модель загружается ~25-30 секунд, поэтому initialDelaySeconds = 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8050
          initialDelaySeconds: 30
          periodSeconds: 5
          failureThreshold: 12
          successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  type: NodePort
  selector:
    app: marketing-roi
  ports:
  - port: 8050
    targetPort: 8050
    nodePort: 30088